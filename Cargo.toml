[workspace]
members = ["vendor/bevy_render", "vendor/bevy_shader", "vendor/bevy_pbr", "vendor/dlss_wgpu", "crates/nrd-wgpu", "crates/fsr-wgpu"]
exclude = ["vendor/wgpu-core", "vendor/wgpu-hal", "vendor/meshopt", "vendor/naga"]
resolver = "3"

[package]
name = "bevy_solarik"
version = "0.1.0"
edition = "2024"
description = "Ray-traced lighting for Bevy 0.20 with sky illumination, analytic lights, glass transport and a reference pathtracer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlrikOlson/bevy_solarik"
readme = "README.md"
keywords = ["bevy", "raytracing", "restir", "lighting", "rendering"]
categories = ["game-development", "rendering"]

[features]
# bevy_pbr's dfg_lut (which this crate needs) turns on bevy_image's KTX2 +
# zstd support but leaves the zstd backend to the application, and bevy_image
# refuses to compile without one. Bevy's own default is the pure-Rust decoder;
# `default-features = false` plus `zstd_c` picks the C one instead.
default = ["zstd_rust"]
zstd_rust = ["bevy_image/zstd_rust"]
zstd_c = ["bevy_image/zstd_c"]
# DLSS Ray Reconstruction as the denoiser (dlss_wgpu through bevy_anti_alias;
# needs DLSS_SDK, VULKAN_SDK and libclang at build time).
dlss = ["bevy_anti_alias/dlss"]
force_disable_dlss = ["bevy_anti_alias/force_disable_dlss"]
# Native capture probes; no systems or readbacks in default builds.
graphics_debug = ["bevy_pbr/graphics_debug"]
# Source-built NVIDIA NRD RELAX, driven through wgpu's Vulkan backend on Windows/Linux.
nrd = ["dep:solarik-nrd-wgpu"]
# AMD FidelityFX Super Resolution as the temporal upscaler (solarik-fsr-wgpu).
# The FfxApi provider DLL is loaded dynamically at runtime: no SDK, account,
# DLL or environment variable is needed to build, and none is linked.
fsr = ["dep:solarik-fsr-wgpu"]
# Register FFX Vulkan device extensions at VkDevice creation (the measured
# ffxCreateContext crash cause). Enables bevy_render's raw Vulkan init seam and
# exposes install_fsr_device_extensions / FsrDeviceInitPlugin; the application
# calls it before the renderer is built. Capability-filtered, safe on all GPUs.
fsr_device_init = ["fsr", "bevy_render/raw_vulkan_init"]
# FSR Ray Regeneration denoiser (DX12, RX 9000+). Wires the denoiser dispatch
# descriptors from solarik-fsr-wgpu::effects into the Solari denoiser slot.
fsr_ray_regeneration = ["fsr"]
# FSR Radiance Caching (DX12) — dispatch chained before the FSR upscaler.
fsr_radiance_cache = ["fsr"]
# Frame generation (FSR FG + DLSS-G) — pacing/swapchain work, post-v1 backlog.
fsr_frame_generation = ["fsr"]
# NGX DLSS-G frame-generation data/keys layer (dlss_wgpu::frame_generation).
# Header-verified parameter keys + enums; the create/evaluate runtime path is a
# documented Unsupported stub until bindings are regenerated with dlssg.h.
# `dlss_wgpu` is reached via bevy_anti_alias / BARD's own direct dependency, not
# a direct dep here, so this is a plain marker feature like the fsr_* ones.
dlss_frame_generation = []
# Initialize NGX D3D12 at device creation for the DX12 backend (DLSS / DLSS RR).
# Registers a RawDx12InitSettings callback that bevy_render now dispatches. The
# application supplies its NGX project id at configure() time; capability-safe.
dx12_ngx_init = ["dep:dlss_wgpu", "dep:uuid"]

[patch.crates-io]
naga = { path = "vendor/naga" }
wgpu-core = { path = "vendor/wgpu-core" }
wgpu-hal = { path = "vendor/wgpu-hal" }
bevy_render = { path = "vendor/bevy_render" }
bevy_shader = { path = "vendor/bevy_shader" }
bevy_pbr = { path = "vendor/bevy_pbr" }
dlss_wgpu = { path = "vendor/dlss_wgpu" }

[dev-dependencies]
bevy_shape = "=0.20.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
futures-lite = "2"
wesl = { version = "0.6.0", features = ["naga-ext"] }
serde_json = "1"

[dependencies]
solarik-nrd-wgpu = { path = "crates/nrd-wgpu", optional = true }
solarik-fsr-wgpu = { path = "crates/fsr-wgpu", optional = true }
dlss_wgpu = { version = "6.0.0", optional = true, features = ["dx12"] }
uuid = { version = "1", optional = true }
bevy_anti_alias = "0.20.0"
bevy_app = "0.20.0"
bevy_asset = "0.20.0"
bevy_camera = "0.20.0"
bevy_color = "0.20.0"
bevy_core_pipeline = "0.20.0"
bevy_derive = "0.20.0"
bevy_diagnostic = "0.20.0"
bevy_ecs = "0.20.0"
bevy_extract = "0.20.0"
bevy_image = "0.20.0"
bevy_material = "0.20.0"
bevy_math = "0.20.0"
bevy_mesh = "0.20.0"
bevy_pbr = { version = "0.20.0", features = ["dfg_lut"] }
bevy_platform = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_post_process = "0.20.0"
bevy_reflect = "0.20.0"
bevy_render = { version = "0.20.0", path = "vendor/bevy_render" }
bevy_shader = "0.20.0"
bevy_transform = "0.20.0"
bevy_utils = "0.20.0"
bytemuck = "1"
blake3 = "1"
derive_more = { version = "2", default-features = false, features = ["from"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[build-dependencies]
# Byte-compare deployed FSR runtime modules so a running game can keep its DLL open.
blake3 = "1"

# Solarik's lint policy; adjust it to support this crate's correctness and maintainability.
[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(docsrs_dep)"]
